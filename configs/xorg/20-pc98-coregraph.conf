# The pc98tridentfb (or pc98cirrusfb) kernel framebuffer exposes the PC-98
# graphics as /dev/fb0.  Bind Xorg to that kernel-owned aperture via the
# fbdev driver rather than probing PC/AT VGA resources.
Section "Device"
    Identifier "PC-98 framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "false"
EndSection

# This minimal SysV rootfs creates the event nodes through devtmpfs, but udev
# does not attach ID_INPUT_* properties to the virtual PC-98 input devices.
# Bind the built-in keyboard and bus mouse explicitly instead of depending on
# Xorg's udev enumeration.  The kernel registers them in this fixed order.
Section "InputDevice"
    Identifier "PC-98 Keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "CoreKeyboard" "true"
EndSection

Section "InputDevice"
    Identifier "PC-98 Bus Mouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
    Option "CorePointer" "true"
EndSection

Section "Monitor"
    Identifier "PC-98 Core-Graph Monitor"
EndSection

Section "Screen"
    Identifier "PC-98 Core-Graph Screen"
    Device "PC-98 framebuffer"
    Monitor "PC-98 Core-Graph Monitor"
    DefaultDepth 8
    SubSection "Display"
        Depth 8
        Modes "1024x768" "800x600" "640x480"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "PC-98 Core-Graph Layout"
    Screen "PC-98 Core-Graph Screen"
    InputDevice "PC-98 Keyboard" "CoreKeyboard"
    InputDevice "PC-98 Bus Mouse" "CorePointer"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection
